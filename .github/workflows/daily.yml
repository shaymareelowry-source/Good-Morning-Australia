name: Generate Daily Yoto Episode

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    env:
      KIDS_CALENDAR_ICS_URL: ${{ secrets.KIDS_CALENDAR_ICS_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python generate.py

      - name: Commit generated files
        run: |
          git config user.name "Good Morning Australia Bot"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "Update daily episode" || echo "No changes to commit"
          git push
